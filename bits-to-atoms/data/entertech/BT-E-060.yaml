caption:
  text: |-
    LOVE LETTER (번호 미배정)

    iQIYI LAND 扬州 · iQIYI · 2026
    중국 장쑤성 양저우의 OTT IP 실내 파크.

    드라마를 보던 사람이 이야기 속으로 들어갑니다. 일곱 구역을 돌며 배우가 연기하는 NPC를 만나고, 숨은 이야기와 소셜 게임에 참여하죠. 선택에 따라 숨은 이야기가 열립니다. 구체적인 분기 방식은 자료에 나와 있지 않습니다.

    제가 주목한 건 등장인물과의 거리입니다. 화면으로 보던 인물이 말을 걸 수 있는 상대가 되면, 관객도 자신이 이야기의 일부라고 느낄 수 있겠죠. 작가의 의도가 아닌, 제 해석입니다.

    브랜드 체험 공간에 적용한다면? 여기부터는 가상 제안입니다. 드라마 팬이 극 중 가게 주인에게 암호 같은 대사를 건네면, 주인이 뒷문을 열어 본편에 없던 장면의 방으로 안내하는 거예요. 기억하던 대사가 공간을 여는 열쇠가 되는 경험입니다.

    대사 외운 보람, 문 앞에서 찾을 줄이야.

    Love Letter (번호 미배정) · Dear, Interaction.
