caption:
  text: |-
    브루노 마스 보러 가는 길, 이번엔 로그인부터.

    2026년 1월 17일, Bruno Mars × Roblox의 ‘Steal a Brainrot’ 콘서트. 브루노 마스는 게임 안에 아바타로 등장해 ‘I Just Might’와 ‘Locked Out of Heaven’을 불렀습니다. 관객은 자신의 아바타로 공연을 보고, 한정 아이템 Brunito Marsito를 받았습니다.

    기네스가 확인한 동시 시청자는 12,862,161명. 단일 아티스트 게임 내 콘서트 최다 동시 시청 기록입니다.

    제가 주목한 건 공연이 찾아간 장소입니다. 관객이 이미 놀던 게임으로 들어가면, 익숙한 놀이 공간이 공연을 만나는 장소가 될 수 있습니다. 이는 에디터의 해석입니다.

    여기서 확장한 가상 제안 하나. 모바일 게임 이용자가 평소 하던 게임에 접속하면, 광장에 브랜드 캐릭터가 나타나 그날만 얻는 아이템을 건넨다면? 브랜드 체험 공간을 이용자의 일상 안으로 옮겨보는 상상입니다. 전달하고 싶은 메시지는 ‘사람이 있는 곳으로 간다’입니다.

    Love Letter 002 / 1000 · Dear, Interaction.
