caption:
  text: |-
    LOVE LETTER 007 / 1000

    洛天依(Luo Tianyi)의 2026 전국 투어 「无限共鸣·纯蓝幻乐」. 7월 18일 베이징 국가체육관에서 첫 공연을 연 버추얼 가수 공연입니다.

    35곡, 5개 챕터로 구성된 세트리스트에는 커뮤니티 창작곡이 다수 포함됐어요. 팬과 창작자들이 온라인에서 곡과 리믹스를 만들고, 공연장에서는 파란 응원봉을 흔들며 함께 노래했습니다.

    제가 주목한 건 팬이 공연의 내용을 보탠다는 점이에요. 내가 만든 곡이 무대에서 불린다면, 공연을 ‘내가 함께 만든 무대’로 느낄 수도 있겠죠. 작가의 기획 의도나 검증된 효과가 아닌, 저의 해석입니다.

    이 원리를 브랜드 체험 공간에 가져온다면? 브랜드 팬 커뮤니티가 온라인에 응원 구호 한 줄을 올리고, 그중 가장 많이 함께 부른 구호를 행사 당일 무대 첫 화면에 띄우는 상상입니다. ‘무대의 첫 줄은 팬이 쓴다’는 경험을 제안해요. 실제 진행된 프로젝트는 아닙니다.

    최애 공연 보러 갔는데 내 곡도 출연 중. 응원봉 든 손에 힘이 좀 들어갈 것 같아요.

    Love Letter 007 / 1000 · Dear, Interaction.
