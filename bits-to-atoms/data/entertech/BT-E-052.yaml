caption:
  text: |-
    LOVE LETTER 043 / 1000

    1st Stage — XR 라이브하우스
    FreeStyle Co., Ltd. · 2026 · 도쿄 하치오지

    버추얼 아티스트를 위한 상설 공연장입니다. 투명 LED 패널에 뜬 캐릭터가 실제 무대 위에 서 있는 것처럼 보이죠. 현장에서도, 생중계로도 공연을 볼 수 있습니다.

    제가 주목한 건 버추얼 가수가 서는 ‘장소’입니다. 실제 무대에 캐릭터를 겹치면, 관객은 가수와 같은 자리에 있다는 느낌을 받을 수도 있겠어요. 여기부터는 제 해석입니다.

    이 원리를 공공 문화시설에 가져온다면? 지역 청소년 창작자가 직접 만든 캐릭터 파일을 가져오고, 주말 저녁 그 캐릭터가 무대에서 10분 공연을 하는 겁니다. ‘누구의 캐릭터도 무대에 설 수 있다’는 메시지를 담은 가상 제안이에요.

    최애에게 주소가 생기다니. 제 외출 사유도 하나 늘었습니다.

    Love Letter 043 / 1000 · Dear, Interaction.
