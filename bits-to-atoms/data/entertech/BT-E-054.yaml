caption:
  text: |-
    LOVE LETTER 019 / 1000

    华晨宇 火星演唱会乐园 2.0
    华晨宇(Hua Chenyu) · 2026
    난징 탕산 음악 계곡

    콘서트를 보러 왔는데, 낮부터 할 일이 있습니다. 설치 작품을 구경하고 게임과 캠핑을 즐기다가, 밤에는 같은 공간에서 콘서트를 봅니다. 조명과 워터 스크린, 드론이 공간을 공연장으로 바꿉니다.

    제 눈에 들어온 건 9,000㎡ 스크린만이 아닙니다. 공연 전에 도착한 관객에게 낮의 놀이를 마련했다는 점입니다. 기다리는 시간에도 즐길 거리가 있다면, 공연을 기억하는 장면이 더 늘어날 수 있겠죠. 제 해석입니다.

    공공 문화시설에 이 원리를 가져온다면 어떨까요? 야외 공연을 기다리는 관객이 낮에 광장의 악기 조형물을 두드리고, 모인 소리가 밤 공연의 첫 박자로 쓰이는 겁니다. 기다림이 공연의 재료가 되는 경험. 실제 프로젝트가 아닌 가상 제안입니다.

    저녁 약속인 줄 알았는데 하루 약속이었군요. 초대장부터 다시 읽겠습니다.

    Love Letter 019 / 1000 · Dear, Interaction.
