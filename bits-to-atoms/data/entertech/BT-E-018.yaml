caption:
  text: |-
    LOVE LETTER (번호 미배정)

    심청을 도우러 갔는데, 고양이로 배역을 받았습니다.

    〈심청 in 성수〉는 식스도파민이 만든 VR 이머시브 뮤지컬입니다. 연출·극본은 박억. 2026년 11월 1~8일, 서울 성수 공간 철(CHUL)에서 선보였습니다.

    관객은 최대 6명이 함께 VR 기기를 쓰고 고양이가 됩니다. 그림을 그리고, 악기를 연주하고, 팔을 움직여 이동하고, 빛나는 표식을 만집니다. 협동 미션을 끝내면 다음 장면이 열리고, 실제 배우가 현장에서 말을 걸고 노래합니다.

    제가 주목한 건 ‘주인공을 돕는 역할’입니다. 이야기를 이끌어야 한다는 부담보다, 작은 일 하나를 거드는 마음으로 참여할 수 있지 않을까요. 고양이라는 역할이 서툰 행동도 편하게 받아들이게 할 수 있다는 건 제 해석입니다.

    이 원리를 공공 문화시설에 가져온다면 어떨까요? 어린이와 보호자가 옛이야기의 동물 조연이 되어 주인공의 심부름을 하고, 끝낼 때마다 다음 장면을 여는 겁니다. 듣던 이야기가 함께 거든 이야기로 남기를 바라는 가상 제안입니다.

    무대 체질인지는 모르겠고, 고양이 손은 보탤 수 있겠습니다.

    Love Letter (번호 미배정) · Dear, Interaction.
