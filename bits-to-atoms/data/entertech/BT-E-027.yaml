caption:
  text: |-
    LOVE LETTER (번호 미배정)

    Storycaster는 목소리로 이야기를 지으면 방의 벽과 실제 물건을 이야기 속 장면으로 바꾸는 연구 프로토타입입니다. 헤드셋 없이, 내레이터의 안내를 따라 이야기를 이어갑니다.

    생성된 장면이 벽에 투사되고, 방 안 물건은 이야기 속 사물로 표현됩니다. 배경음과 대사도 함께 흘러나옵니다.

    제가 주목한 건 정해진 장면을 보는 대신 내 말로 이야기를 전개한다는 점입니다. 익숙한 방이 내가 지은 장면으로 바뀌면, 이야기를 내 것으로 느낄 수 있지 않을까요. 이는 에디터의 해석입니다.

    박물관 아카이브에 적용해 본다면? 작가의 방을 재현한 전시실에서 관람객이 “이 책상에서 무슨 일이 있었어?”라고 묻습니다. 벽에는 그 시절 풍경이, 책상 위 물건에는 당시 모습이 겹쳐 보이는 겁니다. 유물을 질문으로 장면처럼 만나게 하는 가상 제안입니다.

    제 방도 출연 가능하겠네요. 정리부터 해야 오디션을 보겠지만요.

