caption:
  text: |-
    LOVE LETTER 033 / 1000

    〈Cosmos Unseen: Black Holes〉
    Marcus Moresby, Aditi Rajagopal, Bhaumik Patel, Mark Lynch
    2026 · SIGGRAPH 2026 Immersive Pavilion

    헤드셋을 쓰고 맨손으로 은하를 확대하고, 별을 붕괴시키고, 소행성을 블랙홀에 던지는 XR 과학 체험입니다. 던진 소행성은 느려지다 사라지고, 사건의 지평선에서는 내 손이 가는 실처럼 늘어나 빨려 들어갑니다.

    제 눈에 들어온 건 설명의 재료가 된 ‘내 손’입니다. 추상적인 물리 법칙이 내 몸에 일어나는 장면으로 보이면, 조금 더 내 일처럼 느낄 수 있지 않을까요. 여기부터는 제 해석입니다.

    이 원리를 과학관에 가져온다면? 청소년 관객이 화면 앞에서 깊은 바다 쪽으로 손을 뻗고, 수심이 깊어질수록 화면 속 자기 손이 수압에 눌려 작아지는 가상 체험을 상상했습니다. 숫자로 배운 압력을 내 손의 변화에 연결해 보는 제안입니다. 실제 프로젝트가 아닌 상상이며, 손의 축소는 압력을 전달하기 위한 시각적 비유입니다.

    손 한번 댔을 뿐인데, 물리 법칙이 제 손부터 설명하네요.

    Love Letter 033 / 1000 · Dear, Interaction.
