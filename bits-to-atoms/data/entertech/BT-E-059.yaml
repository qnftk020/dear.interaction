caption:
  text: |-
    LOVE LETTER (번호 미배정)
    Cosm Detroit · Cosm · 2026

    디트로이트 다운타운의 돔형 스포츠·엔터테인먼트 관람장. 좌석에 앉아 음식을 시켜 먹으며 스포츠 생중계를 봅니다. 87피트, 12K+ LED 돔이 시야 전체를 경기 화면으로 채웁니다.

    제가 주목한 건 화면이 차지하는 범위예요. 경기가 시야 가득 펼쳐지면, 옆 사람과 함께 소리 지를 계기도 생기지 않을까요. 작품의 효과로 확인된 사실이 아닌, 제 해석입니다.

    여기서 상상한 공공 문화시설 아이디어 하나. 원정 경기에 못 간 팬들이 동네 돔 상영관의 지정 응원석에 앉습니다. 우리 구역 함성이 커질수록 화면 속 관중석에 우리 팀 색이 번진다면? 화면을 함께 채우며 ‘멀리서도 같이 지르는 함성’을 느끼게 하고 싶어요. 실제 프로젝트가 아닌 가상 제안입니다.

    경기는 원정인데 내 자리는 동네였으면. 그런 응원이라면 저도 출석하고 싶습니다.

    Love Letter (번호 미배정) · Dear, Interaction.
