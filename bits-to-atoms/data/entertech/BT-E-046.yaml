caption:
  text: |-
    LOVE LETTER 038 / 1000
    Maze · Sabine Marcelis · 2026

    미로에 들어갔는데, 잠깐 쉬어도 된답니다.

    코첼라 2026, 캘리포니아에 설치된 Maze는 공기를 넣은 거대한 PVC 곡선 튜브 사이로 걸어 들어가 쉬는 작품입니다. 코첼라 밸리의 산세를 본뜬 형태에, 연노랑부터 진한 빨강까지 이어지는 벽. 낮에는 그늘을 만들고 밤에는 빛납니다.

    제가 주목한 건 그늘이라는 쓸모예요. 안으로 들어가 쉬는 행동이 작품을 경험하는 방법이 됩니다. 쉴 곳을 내어주는 것만으로도 관객에게 머물 이유를 줄 수 있겠죠. 작가의 기획 의도와는 구분되는 제 해석입니다.

    이 원리를 공공 문화시설의 여름 야외 축제에 가져온다면? 여기부터는 가상 제안입니다. 방문객이 그늘막 안 벤치에 앉고, 앉은 사람이 늘수록 천막 색이 한 단계씩 짙어지는 거예요. 쉬는 일이 함께 풍경을 만드는 경험이 될 수 있도록요.

    저는 일단 앉겠습니다. 풍경에 보탬이 된다니, 조금 더 앉겠습니다.

    Love Letter 038 / 1000 · Dear, Interaction.
