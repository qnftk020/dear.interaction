caption:
  text: |-
    LOVE LETTER 031 / 1000
    Forest of Time · borabora studios · 2026
    방콕 Happitat, Grand Stairs

    QR을 찍어 나만의 디지털 분신인 Essence를 만들고, 휴대폰으로 숲을 탐색합니다. 여럿의 행동이 하나의 대형 LED 화면 속 숲을 바꿉니다.

    숲에 빛이 돌아오면 빛 조각이던 멸종·멸종위기 동물이 모습을 드러내고, 도감에 기록됩니다. 동남아 야생동물과 보전 상태를 만나는 체험입니다.

    제가 주목한 건 각자의 행동이 모두가 보는 풍경에 남는다는 점. 내가 바꾼 부분을 찾으며 화면을 더 살펴볼 수 있겠다는 해석입니다.

    이 원리를 도서관 로비에 가져온다면? 지나가던 시민이 QR을 찍고 읽은 책 한 권을 고르면, 벽의 서가 그림에 그 책이 꽂히는 상상입니다. 같은 책을 고른 사람끼리는 불빛으로 이어지고요. 혼자 읽은 책이 모두의 풍경이 되는 가상 제안입니다.

    휴대폰을 들었을 뿐인데 숲을 깨우는 일까지. 오늘은 알람보다 큰일을 맡겼네요.

    Love Letter 031 / 1000 · Dear, Interaction.
