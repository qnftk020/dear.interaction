caption:
  text: |-
    LOVE LETTER (번호 미배정)
    하이브 응원 파티 (HYBE Cheering Party) · HYBE · 2026

    HYBE CINE FEST 2026에서 선보인 참여형 극장 상영. 13팀의 뮤직비디오·무대 영상에 3D 시각 효과와 화면 안내가 나오면, 관객은 타이밍에 맞춰 떼창하고 함성을 지르고 응원봉을 흔듭니다.

    다만 안내가 곧 열기를 뜻하진 않았어요. 현장 기사는 같은 날 BTS 라이브 뷰잉의 뜨거운 분위기와 응원 파티의 차분한 분위기를 비교합니다. 응원 파티와 라이브 뷰잉의 시간이 겹쳤다는 지적도 있어, 안내 방식만으로 차이를 설명할 수는 없고요.

    제가 읽은 디자인 질문은 이거예요. 언제 응원할지 알려주는 것과, 응원하고 싶게 만드는 것은 얼마나 다를까?

    그래서 상상한 브랜드 팝업. 팬이 좋아하는 장면에서 스스로 응원봉을 들면, 그 장면의 로비 벽 조명이 밝아집니다. 많이 들린 장면일수록 더 밝게요. ‘지금 흔드세요’라는 지시 없이 모인 반응을 팬심의 기록으로 남겨보는 가상 제안입니다.

    이 조명 반응은 원작의 기능이 아닙니다. 원작의 응원봉과 화면이 무선으로 연동되는지도 자료에는 기재돼 있지 않습니다.

    제 마음의 큐 사인은 제가 낼게요.

    출처: 텐아시아 현장 기사(2026.10.26)
