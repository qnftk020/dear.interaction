caption:
  text: |-
    LOVE LETTER (번호 미배정)
    Phoebe Bridgers — ‘Lost Weekend’ 플라네타리움 청음회

    2026년, 앨범 발매 나흘 전. 전 세계 40여 곳 플라네타리움에서 휴대폰을 넣어 두고 새 앨범을 처음부터 끝까지 듣는 청음회가 열렸습니다. 돔에는 음악과 함께 맞춤 영상이나 레이저 쇼가 펼쳐졌고요.

    제가 주목한 건 휴대폰을 내려놓는 조건입니다. 듣다가 다른 화면으로 넘어갈 기회가 줄면, 한 곡 다음에 또 한 곡을 따라가게 될 수 있겠죠. 집중이 실제로 높아졌다는 성과가 아니라, 이 환경에 대한 제 해석입니다.

    이 원리를 공공 천문관에 옮겨 본다면? 시민들이 입구 보관함에 휴대폰을 넣고, 보관함이 모두 차면 돔 조명이 꺼지며 상영이 시작되는 장면을 상상했습니다. ‘모두가 내려놓아야 시작되는 시간’을 함께 만드는 거죠. 실제 프로젝트가 아닌 가상 제안입니다.

    오늘은 제 폰도 잠시 대기석으로. 귀가 앞자리에 앉을 차례니까요.

    Love Letter (번호 미배정) · Dear, Interaction.
