caption:
  text: |-
    LOVE LETTER (번호 미배정)

    Motion Picture House — Kid A Mnesia
    Thom Yorke, Stanley Donwood (Radiohead)
    2026 · 뉴욕 브루클린 외 순회

    Kid A와 Amnesiac을 다시 듣는 오디오비주얼 설치. 관객은 앉지 않고 공간 안을 자유롭게 떠돕니다. 기울어진 대형 스크린 네 개에는 75분 영상이 흐르고, 여섯 방향의 소리는 서 있는 자리에 따라 다르게 들립니다.

    제가 눈여겨본 건 자리를 고르는 행동이에요. 듣는 위치를 직접 정하면, 익숙한 앨범에서도 소리의 차이를 찾아보게 될 수 있겠죠. 작품의 의도와는 구분한 제 해석입니다.

    이 원리를 음악 전시에 가져온다면? 관람객이 마음에 드는 자리를 찾아 서면, 위치에 따라 악기 하나가 더 크게 들리는 방을 상상해 봅니다. ‘내 자리가 내 믹스가 된다’를 경험하는 가상 제안이에요.

    오늘은 좋은 자리의 기준을 귀에게 맡겨봅니다.

    Love Letter (번호 미배정) · Dear, Interaction.
