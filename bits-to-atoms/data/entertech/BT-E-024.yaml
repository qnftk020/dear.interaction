caption:
  text: |-
    LOVE LETTER (번호 미배정)

    Olaf — Next-Generation Robotic Character
    Walt Disney Imagineering · 2026
    디즈니랜드 파리, World of Frozen

    영화 속 올라프가 스스로 걷고, 표정을 짓고, 말하는 로봇으로 등장했습니다. 데뷔 무대는 라군의 배 위에서 펼쳐지는 ‘Celebration in Arendelle’ 쇼. 흔들리는 배 위에서도 균형을 잡고 걷습니다.

    걷기와 균형은 심층 강화학습으로 배웠습니다. 대화가 가능한 것으로 소개됐지만, 관객과 일대일로 얼마나 대화하는지는 공개 자료에 나와 있지 않습니다.

    제가 주목한 건 ‘얼마나 정확히 걷나’보다 ‘얼마나 올라프답게 걷나’입니다. 익숙한 캐릭터의 버릇이 보이면, 기술을 구경하다가 친구를 만난 듯 느낄 수도 있겠죠. 제 해석입니다.

    이 원리를 브랜드 체험 공간에 가져온다면? 마스코트를 아는 방문객이 인사를 건네면, 로봇이 광고 속 걸음걸이와 말버릇으로 다가와 답하는 장면을 상상합니다. 생김새에 버릇까지 더해 캐릭터를 기억하게 하자는 가상 제안입니다.

    내 마음의 보행 테스트는 통과. 그 뒤뚱거림에 자꾸 눈이 갑니다.

    Love Letter (번호 미배정) · Dear, Interaction.
