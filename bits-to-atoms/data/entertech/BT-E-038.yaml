caption:
  text: |-
    LOVE LETTER (번호 미배정)

    『‘케이팝 데몬 헌터스’ 1주년 공식 팝업』
    비마이프렌즈 × 넷플릭스 · 2026
    더현대 서울 · IP 팝업 스토어

    한옥 인테리어 속 포토존에서 사진을 찍고, MD존에서 굿즈를 고르고, 결제존으로 이동합니다. 사진과 굿즈를 하나의 동선으로 연결한 팝업이에요.

    제가 주목한 건 사진 속 관객의 자리입니다. 작품을 보던 내가 그 세계 안에 선 모습으로 남는 것. 팬에게는 작품을 자기 이야기로 간직하는 경험이 될 수 있다고 봅니다.

    여기서 반응 하나를 더해본다면? 브랜드 체험 공간에서 캐릭터 팬이 주인공과 같은 포즈를 잡고, 포즈가 맞으면 배경 조명이 무대 조명으로 바뀌는 거예요. 사진 한 장에 ‘내 행동에 공간이 답하는 순간’을 더해보는 가상 제안입니다. 실제 팝업에 구현된 기능은 아닙니다.

    Love Letter (번호 미배정) · Dear, Interaction.
