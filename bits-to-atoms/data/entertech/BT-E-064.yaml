caption:
  text: |-
    구경하러 갔는데, 등장인물이 된다면.

    Katana Inc.의 Immersive Fort Tokyo는 도쿄 오다이바에서 관객이 이야기 속 플레이어로 참여하는 12개 어트랙션을 모은 이머시브 테마파크였습니다. 관객이 이야기 안에서 움직이면 배우와 공간이 그들을 이야기의 일부로 대했죠.

    2024년 3월 개장한 파크는 2026년 2월 28일 폐장했습니다. 운영사는 시설이 너무 컸고, 수요는 더 작고 깊은 체험과 더 높은 가격 쪽에 있었다고 설명했습니다.

    제가 읽은 지점은 규모와 참여의 깊이 사이입니다. 관객에게 배역을 주는 방식은 이야기를 자기 일처럼 느끼게 할 수 있습니다. 다만 그것이 운영의 성공까지 보장하지는 않겠죠.

    여기서 상상한 전시 하나. 주말 전시 관람객이 하루 정원 30명인 방 하나를 예약합니다. 방 안의 배우는 각자의 이름을 불러 역할을 줍니다. ‘적게 받을수록 깊어진다’를 경험으로 전해보려는 가상 제안입니다. 인원을 줄이면 실제로 경험이 깊어지는지는 별도로 확인해야 합니다.

    큰 공간보다 나를 알아보는 한 장면. 저는 그쪽에 배역 신청서를 내봅니다.

    자료: Park World, 2026-01-06 — 사례 YAML에 제공된 조사 내용.

