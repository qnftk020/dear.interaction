caption:
  text: |-
    LOVE LETTER (번호 미배정)

    전시 보러 갔는데, 내 심장도 출연한다.

    〈DATALAND — Machine Dreams: Rainforest〉
    Refik Anadol Studio, 2026
    로스앤젤레스 The Grand LA의 AI 아트 뮤지엄 DATALAND 개관전.

    웨어러블이 읽은 심박은 소리 패턴으로 바뀝니다. Thinking Brush에서는 손으로 그리거나 쓸면 형상이 변하고, Fluid Pigments에서는 몸을 움직이면 입자 그림이 됩니다. 관람객 전체의 생체 데이터는 The Sanctuary의 30피트 그림에 모입니다.

    제가 주목한 건 감상하던 몸이 작품의 재료가 된다는 점이에요. 내 반응이 들어갔다면, 내 흔적을 찾아보고 싶어질 수 있겠죠. 다만 모두의 데이터가 섞인 그림에서 ‘내 것’을 알아볼 수 있는지는 별개의 질문입니다.

    여기서 상상한 전시 하나. 둘이 온 관람객이 각자 손목 밴드를 차고 같은 작품 앞에 섭니다. 두 사람의 심박이 맞을 때만 두 색이 하나로 섞인다면? ‘내 데이터는 누군가와 맞닿을 때 보인다’는 경험을 제안해보고 싶어요. 실제 프로젝트가 아닌 가상 제안입니다.

    P.S. 내 심박까지 들었으니, 감상평은 눈치껏 알아줘.

    Love Letter (번호 미배정) · Dear, Interaction.
