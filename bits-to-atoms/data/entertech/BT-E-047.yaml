caption:
  text: |-
    LOVE LETTER (번호 미배정)
    Starry Eyes — Kyriakos Chatziparaskevas

    감상하려고 누웠습니다. 꽤 진지하게요.

    2026년 캘리포니아 코첼라에 설치된 Starry Eyes는 선인장처럼 솟은 12m 탑입니다. 탑 아래 잔디에 누우면 꼭대기의 둥근 창이 하늘을 액자처럼 잘라 보여 줍니다. 바깥 뼈대에 천을 엮은 구조로, 밤에는 등불처럼 빛납니다.

    제가 주목한 건 눕는 자세입니다. 자세를 바꾸며 시선을 무대에서 하늘로 옮긴다는 것. 늘 있던 하늘도 새롭게 바라볼 수 있지 않을까요? 작가의 의도가 아닌, 저의 해석입니다.

    이 원리를 전시에 가져온다면? 미술관 로비 방문객이 바닥 쿠션에 누우면, 천장 창 너머 구름에 맞춰 조용한 소리가 흐르는 공간을 상상합니다. 눕는 행동이 천장을 감상하는 계기가 될 수 있을까요? 실제 프로젝트가 아닌 가상 제안입니다.

    오늘의 감상 태도: 일단 누워 보겠습니다.

    Love Letter (번호 미배정) · Dear, Interaction.
