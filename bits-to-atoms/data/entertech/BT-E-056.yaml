caption:
  text: |-
    LOVE LETTER 015 / 1000

    FIFA Fan Festival Dallas — 인터랙티브 LED 구
    Unilumin × AMS Events, 2026

    월드컵 팬 페스티벌 댈러스에 놓인 지름 5m LED 구. 팬이 QR을 찍고 사진을 올리면, 360도 화면에 실시간으로 나타납니다.

    제가 주목한 건 화면에 등장하는 사람이 바뀐다는 점이에요. 구경하던 내 얼굴이 축제의 화면에 들어갑니다. 그 순간, 나도 이 축제의 일부라고 느낄 수 있지 않을까요. 제 해석입니다.

    공공 문화시설의 광장에 적용해 본다면? 거리 응원에 나온 시민이 QR로 응원 한마디와 사진을 올리고, 골이 들어가면 그 순간 올라온 얼굴들이 광장 화면을 가득 채우는 거예요. ‘함성에 얼굴을 붙인다’는 가상 제안입니다.

    오늘 제 출전 포지션은 전광판입니다.

    Love Letter 015 / 1000 · Dear, Interaction.
