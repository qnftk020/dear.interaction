caption:
  text: |-
    LOVE LETTER 032 / 1000
    인사이드 더 플레이: 군체 · 롯데컬처웍스

    2026년 서울 롯데시네마 신대방. 영화 〈군체〉의 세계를 영화관 건물로 옮긴 관객 참여 공연입니다. 관객은 90분 동안 상영관 6곳과 로비, 복도를 오가며 좀비를 피해 살아남습니다.

    좀비 배우가 등 뒤 벨크로 생존자 표식을 뜯으면 관객도 좀비가 됩니다. 따라갈 배우를 고르면 미끼반·제거반·탈출반으로 이야기가 갈리고요. 좀비가 된 관객에게도 임무가 이어집니다.

    제가 주목한 건 실패 다음의 역할입니다. 생존에 실패해도 참여할 자리가 남아 있다면, 끝까지 이야기 안에서 놀 수 있지 않을까요? 이는 작품을 보고 읽어낸 에디터의 해석입니다.

    이 원리를 전시에 가져온다면? 친구끼리 온 10~20대 관객이 중간 퀴즈를 틀렸을 때, 퇴장 대신 ‘방해꾼’ 역할 카드를 받는 겁니다. 다른 관객의 미션에 끼어들며 끝까지 함께 노는 전시. 실제 프로젝트가 아닌 가상 제안입니다.

    P.S. 생존에는 실패했지만, 분량은 아직 남았습니다.

    Love Letter 032 / 1000 · Dear, Interaction.
