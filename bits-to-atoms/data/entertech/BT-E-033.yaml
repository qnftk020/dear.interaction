caption:
  text: |-
    LOVE LETTER (번호 미배정)

    BTS THE CITY ARIRANG SEOUL
    서울특별시 × HYBE · 2026

    BTS 컴백에 맞춰 서울 랜드마크 15곳을 조명과 미디어파사드, 분수쇼로 연결한 도시 단위 프로모션입니다. 미디어파사드 10곳에는 7개 국어 환영 문구가 뜨고, 분수는 음악에 맞춰 솟습니다.

    팬은 청계천 500m 빛길을 걷고, 반포대교 분수쇼를 보고, K-pop 도보 코스를 따라 도시를 돕니다. 관객의 걸음에 조명이 반응하는 구조로 확인된 것은 아닙니다.

    제가 주목한 건 무대의 범위예요. 도시를 무대로 삼으면, 걷고 구경하는 일도 컴백에 참여하는 경험이 될 수 있겠다고 읽었습니다. 이는 에디터의 해석입니다.

    여기서 상상 하나. 공공 문화시설의 축제 프로그램에서 방문객이 정해진 빛길을 끝까지 걸으면, 걸은 구간만큼 다리 조명이 한 칸씩 이어 켜진다면요. ‘도시는 걸은 만큼 무대가 된다’는 메시지를 발걸음으로 경험하게 하는 가상 제안입니다.

    응원하러 나왔는데 산책까지. 오늘의 앙코르는 조금 더 걷겠습니다.

    Love Letter (번호 미배정) · Dear, Interaction.
