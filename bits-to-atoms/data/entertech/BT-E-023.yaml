caption:
  text: |-
    LOVE LETTER 020 / 1000
    아이돌 데뷔 체험존 — 엔터테크·GES 서울 2026
    서울특별시 · 2026 · 서울 DDP

    내 캐릭터를 정하고, 프로필을 찍고, 데뷔곡까지 만드는 체험존. AI 작곡 체험에서는 관람객이 고른 키워드로 AI가 음악을 만듭니다.

    제가 주목한 건 ‘내가 정하는 과정’이에요. 공연을 감상하던 사람이 자기 캐릭터와 곡을 만드는 자리에 서면, K-POP을 내 이야기로 느낄 수도 있겠죠. 제 해석입니다.

    이 원리를 신제품 팝업에 옮겨 본다면? 방문객이 제품 이름·색·한 줄 소개를 고르고, 그 조합으로 광고 한 컷과 짧은 로고송이 만들어지는 거예요. 만드는 사람 자리에 서면 브랜드가 달리 보일까? 실제 프로젝트가 아닌 저의 가상 제안입니다.

    제 데뷔곡은 생겼는데, 출근 시간은 그대로네요.

    Love Letter 020 / 1000 · Dear, Interaction.
