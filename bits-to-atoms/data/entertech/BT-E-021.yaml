caption:
  text: |-
    LOVE LETTER (번호 미배정)

    《이머시브 궁 (Palace Immersive Goong) — 1902, 황제가 세계를 초대한 밤》
    GiiÖii Immersive Studio · 2026
    서울 금나래아트홀 금나래갤러리

    여섯 명이 외국 사신이 되어 대한제국 마지막 궁중 연회에 들어가는 멀티유저 VR 체험입니다. 함께 걷고, 연주하고, 춤추며 서로의 모습을 볼 수 있어요.

    제가 주목한 건 ‘사신’이라는 역할입니다. 역사를 설명으로 접하는 대신, 그 자리에 초대받은 손님이 되는 거죠. 내 자리와 할 일이 생기면 과거의 장면도 나와 관계있는 일처럼 느껴질 수 있겠다는 해석입니다.

    이 원리를 박물관 아카이브에 가져온다면? 궁궐 야간 관람객이 입구에서 초대받은 손님의 이름표를 고르고, 전각마다 안내자가 그 손님의 자리와 차례를 알려 주는 방식을 상상했습니다. ‘초대받은 사람은 유물을 어떻게 다르게 볼까?’를 묻는 가상 제안입니다.

    연회에 제 자리까지 있다니. 일단 이름표부터 확인하겠습니다.

    Love Letter (번호 미배정) · Dear, Interaction.
