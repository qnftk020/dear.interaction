caption:
  text: |-
    LOVE LETTER 045 / 1000

    Voyage: Beyond the Unexplored / Sky: Cloud Journey
    日本科学未来館(Miraikan) × WOW, 2026
    도쿄 미라이칸 7층

    미지의 세계와 구름 속을 보여 주는 과학관 상영 공간입니다. Voyage는 15석 극장에서 약 15분, Sky는 홀에서 5분 동안 관람합니다.

    곡면 LED와 12.2채널 공간 음향, 4면과 바닥을 채우는 투사를 사용하고, 특별 회차에는 안개와 바람도 나옵니다. 관객의 행동에 화면이 반응하는 방식이 아니라, 상영을 보고 감각으로 받아들이는 경험입니다.

    제가 가져오고 싶은 건 ‘15명이 함께 기다리는 방’이라는 조건입니다. 작은 공간에서 시작을 기다리면 화면뿐 아니라 옆 사람의 기척도 느낄 수 있지 않을까요? 이는 제 해석입니다.

    여기서 한 걸음 더 간 가상 전시를 상상합니다. 과학관 관람객 15명이 번호표를 받고 어두운 방에 들어갑니다. 모두의 숨소리가 잦아들면 화면이 시작됩니다. 함께 조용해지는 행동이 관람의 시작을 여는 셈이죠. 실제 작품의 기능이 아닌 제안입니다.

    관람 참고: 제공된 공식 안내상 2026년 10월 1일부터 2027년 4월 22일까지 개보수 휴관 기간입니다.

    Love Letter 045 / 1000 · Dear, Interaction.
