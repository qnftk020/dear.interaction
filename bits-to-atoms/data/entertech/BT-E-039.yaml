caption:
  text: |-
    LOVE LETTER (번호 미배정)

    〈콩X고질라 : 더 라이드〉는 탐사선을 타고 지하 세계로 내려가 콩과 고질라를 만나는 레일 없는 다크라이드입니다. 2026년 서울 롯데월드 어드벤처에 공개됐습니다.
    제작: 롯데월드 × 레전더리 × 도호 × 샐리 다크라이드.

    탑승객은 모나크 신입 요원이 되어 탐사선에 탑니다. 탑승체는 영상과 실시간으로 맞물려 움직이며 타이탄들 사이를 지납니다.

    제가 주목한 건 ‘신입 요원’이라는 역할입니다. 몸의 움직임에 이야기 속 자리가 더해지면, 같은 장면도 구경보다 출동처럼 느껴질 수 있겠죠. 에디터의 해석입니다.

    이 원리를 과학관에 가져온다면? 어린이에게 탐사대원 명찰을 주고, 전시물마다 명찰 속 이름을 불러 임무를 하나씩 건네는 상상입니다. 역할 하나로 관람을 탐사 임무처럼 느끼게 할 수 있을까요? 실제 프로젝트가 아닌 가상 제안입니다.

    첫 출근에 타이탄 대면이라니. 신입 교육은 꽤 확실하네요.

    Love Letter (번호 미배정) · Dear, Interaction.
