caption:
  text: |-
    LOVE LETTER (번호 미배정)
    Mundo Pixar Experience London
    Pixar Animation Studios 외 · 2026 · 런던 Wembley Park

    픽사 영화 14편의 세계를 실제 크기로 걸어 다니는 전시. 앤디의 방에서는 장난감 크기가 되어 보고, 방마다 숨은 빨간 별이 그려진 노란 공을 찾습니다. 공간마다 음악과 향도 달라집니다.

    제가 눈여겨본 건 숨은 공입니다. 찾을 것이 하나 생기면, 지나칠 구석도 다시 살펴볼 수 있겠죠. 관람에 작은 목표를 더한다는 해석입니다.

    이 원리를 전시에 옮겨본다면? 가족 관람객이 전시실마다 숨은 작가 서명을 찾고, 모두 찾으면 출구에서 서명이 모인 엽서 한 장을 받는 겁니다. 숨은 서명을 찾으며 작품 주변까지 더 살펴보게 될까요? 실제 진행 사례가 아닌 제 상상이며, 관람 시간이 늘어날지는 확인이 필요합니다.

    공 하나가 제 눈길에 할 일을 주네요.

    Love Letter (번호 미배정) · Dear, Interaction.
