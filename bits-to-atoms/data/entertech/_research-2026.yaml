    status: 확인
  - name: 드론 군집과 건물 외벽 영상
    what: 드론 수백~수천 대로 하늘에 얼굴과 별자리를 그리고, 문화유산과 건물 외벽에 영상·레이저·조명·소리를 겹칩니다.
