caption:
  text: |-
    LOVE LETTER 037 / 1000
    BTS × 대영박물관 — What is Your Arirang?
    방탄소년단 × The British Museum

    최애를 따라 박물관에 왔다면, 어떤 유물이 마음에 남을까요?

    2026년 7월 6~23일, 런던 대영박물관 한국실에서 진행된 프로젝트. ‘BTS THE CITY ARIRANG – LONDON’의 일환입니다.

    입구 QR을 찍으면 휴대폰에 한국실 관람 코스가 열립니다. 관람객은 코스를 돈 뒤 마음에 남은 유물을 SNS에 공유하며 ‘당신의 아리랑은 무엇인가요?’에 답합니다.

    제가 주목한 건 관람객에게 자기 답을 남길 자리를 준다는 점입니다. 유물을 고르고 질문에 답하면서, 관람이 자신의 취향과 이야기를 발견하는 시간이 될 수도 있겠어요. 에디터의 해석입니다.

    여기서부터는 박물관 아카이브를 위한 가상 제안. 좋아하는 아티스트를 따라 처음 온 팬이 노래 제목과 닮은 유물을 골라 사진을 찍으면 어떨까요? 고른 유물 사진들이 그 사람만의 앨범 재킷 한 장으로 묶여 나오는 겁니다. 팬심이 유물을 읽는 눈이 되도록요.

    최애 따라왔는데, 취향의 연대가 신라까지 넓어질 줄이야.

    Love Letter 037 / 1000 · Dear, Interaction.
