caption:
  text: |-
    LOVE LETTER (번호 미배정)

    안경을 쓰고 걸으면, 전시실 위로 옛 서울의 건물과 생활 모습이 겹쳐 보입니다.

    〈Time Travel in Seoul — AR 글래스 관람〉은 서울역사박물관 × Qualcomm × Hypercloud의 2026년 시범 관람 프로젝트입니다. 장소는 서울역사박물관 3층 상설전시실.

    관객은 가상 유물 카드를 모으고 시대 퀴즈를 풉니다. 안내 캐릭터 ‘갓생 도령’은 길을 잡아 줍니다.

    제가 눈여겨본 건 카드 수집입니다. 읽어야 할 설명에 모으고 싶은 대상이 더해지면, 다음 전시실로 향할 이유가 생길 수 있겠죠. 이건 작품을 바라본 제 해석입니다.

    박물관 아카이브에 이 원리를 가져온다면? 역사관을 찾은 초등학생이 전시실마다 숨은 생활 도구 카드를 찾고, 모은 카드로 그 시대 사람의 하루 일과표를 완성하는 겁니다. 유물들을 하루의 흐름으로 연결해 이해하도록 돕는 가상 제안입니다.

    저는 과거를 보러 갔는데, 발걸음은 자꾸 다음으로 가겠네요.

    Love Letter (번호 미배정) · Dear, Interaction.
