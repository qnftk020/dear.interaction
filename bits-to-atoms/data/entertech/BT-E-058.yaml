caption:
  text: |-
    LOVE LETTER 012 / 1000

    〈Lander 23〉, Punchdrunk
    2026 · 런던 The Carriageworks

    친구 넷이 외계 행성 탐사팀이 됩니다. 표본을 모으고 우주선으로 돌아오는 공연이에요. 실패하면 목숨을 잃고, 재생성돼 다시 도전합니다. 현장의 라이브 배우 대신 녹화된 연기자가 이끕니다.

    제가 주목한 건 ‘실패할 수 있는 임무’예요. 관객에게 성공과 실패가 생기면, 다음 시도에서 무엇을 바꿀지 궁금해질 수 있겠죠. 재도전이 호기심을 이어줄 수 있다는 건 제 해석입니다.

    전시에 가져온다면? 여기부터는 가상 제안입니다. 과학관을 찾은 친구 넷이 제한 시간 안에 전시실에서 표본 카드 다섯 장을 찾습니다. 시간을 넘기면 조명이 붉게 바뀌고 처음 방에서 다시 시작해요. 실패가 전시를 다시 걸어볼 계기가 될 수 있을까요?

    제 퇴근은 미뤄져도, 다음 시도는 궁금하네요.

    Love Letter 012 / 1000 · Dear, Interaction.
