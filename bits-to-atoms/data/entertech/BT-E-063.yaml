caption:
  text: |-
    로봇 개 두 마리, 관객은 공동 양육자.

    〈Dog Walk: Narrating Human-AI Alignment through Companion Robots〉는 Robert Twomey(UC San Diego)와 Jesse Fleming(The Awareness Lab)의 연구 프로토타입입니다. 2026년 SIGGRAPH Spatial Storytelling에서 선보인 이 작품에서는 관객이 로봇 개 둘을 함께 돌보고, 로봇에 탑재된 언어 모델은 일상의 경험에 따라 달라집니다.

    작품은 친밀감과 몸을 통한 경험, 인공 반려를 탐구합니다. 제가 주목한 건 ‘사용’에서 ‘돌봄’으로 바뀐 관객의 역할이에요. 함께 돌보는 일이 쌓이면 기계를 관계의 상대로 느낄 수도 있겠죠. 에디터의 해석입니다.

    전시에 적용해 본다면? 전시 기간에 거듭 찾아오는 관람객이 로봇에게 오늘의 한마디를 가르치고, 폐막 날 로봇이 그동안 배운 말로 인사하는 겁니다. 관객의 말이 쌓여 마지막 날 완성되는 작품. 실제 프로젝트가 아닌 가상 제안입니다.

    사용 설명서 옆에 양육 분담표도 놓아야겠어요.

    Love Letter 041 / 1000 · Dear, Interaction.
