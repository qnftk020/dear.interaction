caption:
  text: |-
    빌리 공연 보러 갔다가, 제가 부르게 됐습니다.

    Billie Eilish × Roblox — The Block(2026)은 빌리 아일리시의 콘서트 무대를 본뜬 로블록스 공간입니다. 3D 공연 영화 홍보와 연결된 체험으로, 팬이 아티스트 역할을 맡아 노래방처럼 따라 부릅니다.

    공간에서는 3D 영상과 조명이 무대처럼 움직이고, 투어 안무 아바타 동작도 쓸 수 있습니다.

    제가 주목한 건 자리의 변화입니다. 공연을 바라보던 사람이 직접 부르는 역할을 맡으면, 공연을 자기 경험으로 받아들일 수도 있겠죠. 이는 제 해석입니다.

    전시로 옮겨 본다면? 공연 실황 전시 관람객이 가운데 마이크 앞에서 노래하면, 객석 쪽 화면의 관객들이 노래에 맞춰 불빛을 흔드는 겁니다. 보던 자리와 서는 자리를 바꿔 보는 가상 제안입니다.

    마이크 앞자리라니. 이번엔 앉아서 보기 어렵겠네요.
