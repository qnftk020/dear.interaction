caption:
  text: |-
    LOVE LETTER 011 / 1000

    로봇 앞에서 제가 할 일은? 일단 포즈부터.

    갤럭시 로봇파크(Galaxy Robot Park)는 갤럭시코퍼레이션이 2026년 서울 강동구에 연 로봇 복합문화공간입니다. 로봇이 K-POP 군무를 추고, 관람객의 초상화를 그리고, 아이스크림을 만듭니다. 관람객이 로봇을 직접 조종하거나 안아 보는 프로그램도 있습니다.

    제가 주목한 건 초상화입니다. 로봇을 바라보던 사람이 그림의 주인공이 됩니다. 내 얼굴이 담긴 결과물 덕분에 기술 체험이 내 이야기로 남을 수 있겠다고 봤어요. 에디터의 해석입니다.

    이 원리를 브랜드 체험 공간에 옮겨 본다면? 가족 방문객 중 아이가 포즈를 취하고, 로봇이 브랜드 캐릭터 화풍으로 초상화를 그려 건네는 장면을 상상했습니다. 기술을 설명보다 선물로 기억하게 하자는 가상 제안입니다.

    오늘은 로봇 구경하러 왔다가 모델로 일하고 갑니다.

    Love Letter 011 / 1000 · Dear, Interaction.
