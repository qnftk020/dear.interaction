caption:
  text: |-
    최애가 하늘에 뜨면, 휴대폰도 고개를 든다.

    BTS ‘THE CITY ARIRANG’은 HYBE의 2026년 컴백 프로모션이다. 서울 뚝섬에서는 드론 수천 대가 멤버 7명의 얼굴을 그렸고, 숭례문에는 멤버 실루엣이 떴다. 런던과 뉴욕의 건물에도 앨범 영상이 펼쳐졌다.

    관객이 화면이나 드론을 조작하는 요소는 없다. 현장의 시민들은 모여 올려다보고 휴대폰으로 촬영했다. 촬영에 따라 작품이 달라지는 구조는 아니다.

    내가 주목한 건 시선이 모이는 방식이다. 각자의 화면을 보던 사람들이 같은 순간 같은 하늘을 바라본다. 함께 본 장면이 컴백의 기억으로 남을 수 있다는 게 내 해석이다. 촬영한 장면이 홍보로 이어질 가능성도 떠올려 본다.

    여기서부터는 가상 제안. 공공 문화시설의 야간 축제에서 관람객이 강변에 모여 휴대폰 불빛을 든다면? 불빛이 많이 모인 쪽 하늘부터 드론 그림이 완성되게 해보는 것이다. 올려다보던 하늘에 내 불빛도 보탰다는 경험을 제안한다.

    분명 하늘을 보러 갔는데, 내 폰도 맨 앞줄을 원하네.

    Love Letter 005 / 1000 · Dear, Interaction.
