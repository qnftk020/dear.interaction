caption:
  text: |-
    LOVE LETTER 022 / 1000

    初音ミク 夜空プログラム 2026 × XREAL 불꽃 AR
    Gugenka × XREAL · 2026 · 니가타 일보 미디어십

    AR 글래스를 쓰고 불꽃놀이를 올려다보면, 실제 불꽃 위에 가상 효과가 겹쳐 보입니다. 하츠네 미쿠 행사에서 선보인 불꽃 AR 체험이에요.

    제가 주목한 건 같은 하늘에 연출을 더하는 방식입니다. 실제 불꽃과 가상 효과를 함께 보면, 하늘 전체를 하나의 무대로 느낄 수도 있겠어요. 여기부터는 제 해석입니다.

    공공 문화시설에 이 원리를 가져온다면? 지역 불꽃축제 관람객이 강둑에서 글래스를 쓰고 하늘을 봅니다. 불꽃이 터진 자리에서 지역 설화 속 동물이 걸어 나오는 거죠. 하늘은 그대로 두고 이야기만 겹치는 경험. 실제 프로젝트가 아닌 가상 제안입니다.

    저는 하늘 보러 갔다가 이야기까지 보고 오는 쪽에 한 표.

    Love Letter 022 / 1000 · Dear, Interaction.
