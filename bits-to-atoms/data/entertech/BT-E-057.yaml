caption:
  text: |-
    LOVE LETTER 044 / 1000

    응원하러 갔다가 작품의 한 조각이 된다면.

    〈Faces of Fan Festival〉은 Miami Host Committee의 2026년 월드컵 팬 페스티벌 설치입니다. 마이애미 Bayfront Park에서 팬이 사진과 짧은 메시지를 내면, 계속 커지는 대형 콜라주에 더해집니다. 대회의 공동 기억을 남기려는 취지예요.

    제가 주목한 건 기록을 채우는 사람입니다. 팬이 자기 사진과 말을 보태면, 대회의 기록을 ‘나도 들어 있는 기억’으로 느낄 수 있겠죠. 이건 저의 해석입니다.

    이 원리를 박물관 아카이브에 가져온다면 어떨까요? 지역 축제 방문객이 사진 한 장과 한 줄을 내면, 그해 축제 지도에서 사진을 찍은 자리에 붙는 거예요. 방문객이 축제의 기록을 채우는 가상 제안입니다.

    응원만 하러 왔는데, 작품에 제 자리까지 생겼네요.

    Love Letter 044 / 1000 · Dear, Interaction.
