caption:
  text: |-
    LOVE LETTER (번호 미배정)

    맨날 따라 부르던 아기상어에게, 이번엔 내가 할 말이 생겼다.

    〈Baby Shark The Experience: Unlock the Secret Ocean〉은 더핑크퐁컴퍼니가 2026년 서울 DDP에서 선보인 생성형 AI 캐릭터 체험 전시다. 아이가 말을 걸고 손짓하거나 몸을 움직이면 캐릭터가 실시간으로 대화하고 움직임에 반응한다. 아이 이름이 들어간 아기상어 노래도 만들어진다.

    내가 주목한 건 ‘보던 캐릭터’가 ‘대화하는 상대’로 바뀌는 순간이다. 내 말과 움직임에 답이 돌아오면, 익숙한 캐릭터의 이야기가 내 이야기처럼 느껴질 수 있다. 이는 작가의 기획 의도가 아닌 나의 해석이다.

    이 원리를 어린이 도서관에 가져온다면? 여기부터는 가상 제안. 방문 가족의 아이가 그림책 캐릭터에게 오늘 읽은 책 제목을 말한다. 캐릭터가 그 책 이야기로 되묻고, 아이의 답으로 한 줄짜리 뒷이야기를 지어 준다. 읽은 책이 대화가 되는 경험을 상상했다.

    늘 노래를 따라 부르던 사이에 내 이름까지 들어간다니. 이 정도면 나도 피처링 아닌가요.

    Love Letter (번호 미배정) · Dear, Interaction.
