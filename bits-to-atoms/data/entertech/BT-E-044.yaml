caption:
  text: |-
    LOVE LETTER 025 / 1000

    5년 전 공연 출석이 아직 통하다니. 이 세계는 저보다 기억력이 좋네요.

    Zara Larsson의 ‘Midnight Sun’은 2026년 5월 15일 공개된 로블록스 한정 앨범 체험입니다. 해와 달 테마 공간을 탐색하고, 장애물 미니게임과 보물찾기에 참여하며 세 곡의 공연을 만납니다.

    제가 주목한 건 2021년 콘서트 배지 보유자에게 주는 추가 보상. 예전 참여의 증표를 이번 체험에서도 알아봐 주는 방식입니다. 다시 온 사람에게는 ‘내가 그때 거기 있었지’라는 기억을 꺼내는 계기가 될 수 있겠어요. 제 해석입니다.

    이 원리를 브랜드 체험 공간에 옮겨본다면? 매년 팝업을 찾는 단골이 작년에 받은 스탬프 카드를 내밀면, 카드에 찍힌 방문 연도 수만큼 숨은 방이 하나씩 더 열리는 거예요. ‘다시 온 사람에게만 열리는 문’을 상상한 가상 제안입니다.

