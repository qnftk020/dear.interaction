caption:
  text: |-
    LOVE LETTER 029 / 1000

    IVE × DDP 365 Light — DIVE IN TO LIGHT
    IVE × 서울시 × 서울디자인재단 × Livelab, 2026

    아이브의 컴백 영상이 서울 DDP 외벽에 펼쳐집니다. ‘Looks Can Kill’ 뮤직비디오의 DDP 버전에 레이저·조명·사운드가 더해집니다.

    외벽 공연을 보는 경험에 더해, 히어로 마스크 전시물과 포토존도 마련됐습니다. 포토존에서 촬영하고 SNS에 인증하면 기념엽서를 받는 이벤트도 진행됐습니다. 마스크와 SNS 이벤트는 11월 1일까지였어요.

    제가 주목한 건 화면의 자리입니다. 휴대폰 안의 뮤직비디오가 건물 외벽으로 옮겨오면, 찾아보지 않던 사람도 산책 중 컴백을 목격할 수 있겠죠. 이건 관람 효과가 검증됐다는 뜻이 아닌, 저의 해석입니다.

    여기서 공공 문화시설을 위한 상상 하나. 저녁 산책 나온 시민이 광장 바닥의 표시 위에 서면, 선 사람 수만큼 외벽의 빛줄기가 늘어나는 겁니다. ‘건물은 모인 사람 수로 완성된다’는 메시지를 함께 만드는 경험으로요. 실제 프로젝트가 아닌 가상 제안입니다.

    이번 컴백, 화면 크기부터 주머니 사정을 벗어났네요.

    Love Letter 029 / 1000 · Dear, Interaction.
