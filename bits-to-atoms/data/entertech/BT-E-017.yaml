caption:
  text: |-
    LOVE LETTER 030 / 1000
    〈곱을락〉 · 컴퍼니 우연

    객석 없는 극장에서는 관객도 걸음을 보탭니다. 가족사진을 들고 걷고, 돌을 쌓고, 꽃을 빛이 닿는 곳으로 옮깁니다. 그러면 멈춰 있던 공간에 빛과 소리가 돌아오고, 누워 있던 인물들이 하나둘 움직입니다.

    〈곱을락〉은 컴퍼니 우연이 만들고 양해연이 연출한 제주4·3 소재의 이머시브 연극입니다. 2026년 9월 25~27일 서울 연희예술극장에서 공연됐습니다. 제목은 제주어로 숨는다는 뜻이자 숨바꼭질을 가리킵니다.

    연출이 중요하게 여긴 것은 관객이 센서를 알아차리는 것보다, 기억하려 한 자신의 행동이 공간을 바꿨다고 느끼는 경험입니다. 제게는 기억을 바라보던 사람이 손을 보태는 사람이 된다는 점이 흥미롭습니다. 작은 행동에 공간이 응답하면, 기억에 참여한다는 감각이 생길 수 있겠지요.

    이 원리를 박물관 아카이브에 가져온다면? 여기부터는 가상 제안입니다. 지역 역사관을 찾은 가족 관람객이 옛 주민의 물건 복제품을 제자리에 놓으면, 그 자리에 조명이 켜지고 주민의 목소리 기록이 흐르는 겁니다. 기억을 제자리에 돌려놓는 경험을 제안하고 싶습니다.

    Love Letter 030 / 1000 · Dear, Interaction.
