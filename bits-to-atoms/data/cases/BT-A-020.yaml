caption:
  text: |-
    자판기가 국경 너머를 보는 창문이 될 수 있을까요?
    Small World Machines는 인도와 파키스탄의 자판기를 실시간 영상으로 이어, 함께 그림을 그리면 콜라가 나오게 한 Coca-Cola 캠페인입니다.
    화면을 만지는 확장 사례지만, 협업이 보상이 되는 구조를 함께 기록합니다.

    Small World Machines — Coca-Cola / Leo Burnett Sydney (2013)
