caption:
  text: |-
    모래 위의 낙서는 어디로 갈까요?
    Sybil은 막대기로 그린 흔적을 로봇 팔이 씨앗 그물 위의 물길로 옮겨, 닷새 동안 싹을 틔우는 설치입니다.
    즉각적인 반응 대신 '기다림'을 설계한 인터랙션을 살펴봤습니다.

    Sybil — Daniela Mitterberger, Fabio Scotto, Ruth Sidabutar, Linfeng Zhou, Tiziano Derme, Samuelle Bourgault, Charlotte Thorn / ETH Zurich, MAEID · Ars Electronica Festival 2026
