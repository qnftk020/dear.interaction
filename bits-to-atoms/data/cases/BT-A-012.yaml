caption:
  text: |-
    내가 기계를 움직이는 걸까요, 기계가 나를 움직이는 걸까요?
    Who Is Jumping, Jack?은 관객의 팔 움직임을 서보로 움직이는 코르크스크루들의 동작으로 바꾸는 키네틱 설치입니다.
    물건을 만지지 않는 확장 사례지만, 몸과 기계의 관계를 선명하게 보여 줘서 함께 기록합니다.

    Who Is Jumping, Jack? — Nathalie Kronberger / Kunstuniversität Linz · Ars Electronica Festival 2026
