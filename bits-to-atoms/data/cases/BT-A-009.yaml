caption:
  text: |-
    산호가 아프다는 걸 손으로 느낄 수 있을까요?
    Lighting the Reef는 종이 산호 모듈을 쌓아 연결이 맞으면 빛나고, 오염 모듈을 끼우면 흐려지는 종이 회로 설치입니다.
    설명 대신 '연결'로 생태계를 이해하게 만드는 방식을 살펴봤습니다.

    Lighting the Reef — Ruhan Yang, Yuchen Zhang, Ellen Yi-Luen Do / ACME Lab, ATLAS Institute, CU Boulder (TEI '26)
