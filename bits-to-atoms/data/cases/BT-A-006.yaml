  text: |-
    악보 없이, 앉는 것만으로 연주할 수 있을까요?
    Sound Bananas는 바나나 모양 오브젝트에 앉고 흔들고 밀면 사람들의 움직임이 함께 음악이 되는 설치입니다.
    참여의 문턱을 몸의 기본 동작까지 낮춘 설계를 들여다봤습니다.

