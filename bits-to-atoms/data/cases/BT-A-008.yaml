caption:
  text: |-
    스마트홈 기기가 꼭 플라스틱이어야 할까요?
    GlassIO는 터치 센서와 LED를 품은 스테인드글라스를 실제 가정에 3주씩 설치해, 사람들이 어떻게 함께 살아가는지 관찰한 연구입니다.
    공예와 기술이 만날 때 생기는 '따뜻한 인터페이스'를 들여다봤습니다.

    GlassIO — Daniel Gagnon-King, Lee Jones, Alisa Gamayunova, Sara Litwiniuk, Renee (Xinyu) Chen, Alisa Liu, Catherine Stinson, Sara Nabil / iStudio, Queen's University (TEI '26)
