    공이 광고판에 맞으면 쿠폰이 풀립니다.
    Touchboard Discounts는 경기 중 공이 광고판에 닿는 순간 팬들에게 할인 쿠폰을 제공한 캠페인입니다.
    관객이 조작하는 대신 경기 속 공이 입력이 되는 확장 사례입니다.
    제 해석으로는 이미 보는 경기의 사건에 혜택을 연결해 광고를 살필 계기를 만들 수 있습니다.
    
