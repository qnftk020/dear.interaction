  text: |-
    광고 지면이 아이를 지켜 줄 수 있을까요?
    Protection Ad는 잡지 광고에서 팔찌를 떼어 아이에게 채우면, 정한 거리를 벗어날 때 부모 휴대폰에 알람이 울리는 Nivea 캠페인입니다.
    읽는 광고가 쓰는 물건이 되는 방식을 살펴봤습니다.

    Protection Ad — NIVEA / DraftFCB Brasil (2014)
