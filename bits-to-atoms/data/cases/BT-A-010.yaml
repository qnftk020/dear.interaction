caption:
  text: |-
    애니메이션을 타임라인 대신 손으로 만들 수 있을까요?
    Rig-a-Doodle은 손그림 캐릭터에 직접 만든 리그를 연결해, 인형극처럼 움직이면 그림이 실시간으로 따라 움직이는 키트입니다.
    '연기하는 인터페이스'가 창작의 문턱을 어떻게 낮추는지 살펴봤습니다.

    Rig-a-Doodle — Krithik Ranjan, Khushbu Kshirsagar, Harrison Jesse Smith, Ellen Yi-Luen Do / ACME Lab, ATLAS Institute, CU Boulder (TEI '26)
