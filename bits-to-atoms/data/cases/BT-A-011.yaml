caption:
  text: |-
    AI가 데이터로 배운다는 걸, 손으로 이해할 수 있을까요?
    DataBites는 탠저블 조각으로 피자와 샌드위치 예시를 만들어 분류 AI를 직접 학습시켜 보는 박물관 전시 프로토타입입니다.
    추상적인 AI 개념을 '함께 만드는 경험'으로 바꾸는 방식을 살펴봤습니다.

    DataBites — Hasti Darabipourshiraz, Dev Ambani, Duri Long 외 / Creative Interfaces Lab, Northwestern University
