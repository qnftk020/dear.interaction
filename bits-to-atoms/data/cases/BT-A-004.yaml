    - '[03 원문] output: 화면에 짧은 이야기가 뜨고, 펌프가 최대 네 가지 오일을 섞어 향을 만든다 — 용기를 들어 향을 맡는다'
    - '[03 원문] mechanism: 비전-언어 모델이 사진 캡션 생성 → LLM이 이야기와 향 레시피 생성 → 연동 펌프 4개가 유리병에서 오일을 블렌딩'
