# 데일리 기록 — 2026-11-12 아침 업로드분 (2026-11-11 소식 3건). 작성 규칙: ../../DAILY.md
date: 2026-11-12
covers: 2026-11-11
items:
  - title: 전주 팔복예술공장 미디어아트 전시 '실감지향'
    category: 이머시브
    source:
      name: 투데이안
      url: https://www.todayan.com/news/articleView.html?idxno=636792
      published: 2026-11-11
    happened: 미확인
    what: 전주문화재단이 전주의 전통문화와 지역의 기억을 다시 풀어낸 미디어아트 3편을, 네 면이 LED 화면인 방 '디큐브'에서 무료로 보여 준다.
    insight: 전통문화는 진열장 너머로 볼 때보다, 그 한가운데에 서 있을 때 새롭게 보인다.
    insight_basis: 에디터가 읽어냄
    idea: 가마의 불길과 전주의 풍경을 화면 하나에 담지 않고, 관객이 서 있는 방의 앞·양옆·천장 전체로 펼친다.
    execution:
      - 팔복예술공장 B동 디큐브에 현장 선착순으로 들어간다 (한 번에 최대 30명)
      - 정면·좌우 벽·천장 네 면의 LED 화면과 거울 구조, 음향에 둘러싸인다
      - 초인의 '뺄불통가마'에서는 전통 가마의 불길이 방 전체를 감싼다
      - 햅카이브의 '잔상, 전주'에서는 익숙한 전주 풍경이 큰 디지털 이미지로 펼쳐진다
      - 오랩의 '모이고 연결되는'까지 세 편을 이어서 본다
    tech:
      - 4면 LED 스크린 (정면·좌우 벽면·천장)
      - 거울 구조
      - 음향
    unknown:
      - 전시 개막일 (기사에는 11월 22일까지라는 종료일만 있음)
      - 오랩 '모이고 연결되는'의 내용
      - 관객의 움직임에 화면이 반응하는지 여부 (기사에는 감상 방식만 나옴)
      - 작품별 상영 시간

  - title: 일본 '제1회 휴머노이드 로봇 엑스포' 가을 전시 개막
    category: 로봇
    source:
      name: 로봇신문
      url: https://www.irobotnews.com/news/articleView.html?idxno=49527
      published: 2026-11-11
    happened: 2026-11-11
    what: 휴머노이드 완제품과 도입 사례만 모은 전시회가 일본 지바 마쿠하리 메세에서 사흘 일정으로 열렸고, 관람객이 로봇 한 대를 함께 조립해 이름을 붙이는 행사가 붙어 있다.
    insight: 사람들은 다 만들어진 로봇을 구경할 때보다, 직접 조립하고 이름을 붙일 때 그 로봇을 자기 일로 받아들인다.
    insight_basis: 에디터가 읽어냄
    idea: 전시회 안에서 휴머노이드 한 대의 '탄생'을 관람객과 함께 치른다 — 조립하고, 이름을 짓고, 옷을 입히고, 첫걸음을 본다.
    execution:
      - 전시장에서 안내·접객용 로봇 '워커 C1'이 돌아다니며 방문객을 응대하는 시연을 본다
      - 12~13일 공동 창작 프로그램 '더 서클'에서 부품 상태의 2족 보행 휴머노이드를 현장에서 조립한다
      - 조립한 로봇의 이름과 특징을 관람객이 제안한다
      - 13일에 로봇의 의상을 공개하고 이름을 정한다
      - 같은 날 로봇이 첫걸음을 떼는 시연으로 마무리한다
    tech:
      - 유비테크 워커 C1·워커 S2
      - 유니트리 G1 + 엔비디아 GR00T N1.7
      - VLA(시각·언어·행동) 모델
      - LLM 기반 대화형 휴머노이드
      - 로봇 핸드 Xmano (미네베아미쓰미)
      - 신축성 힘·압력 센서 (포시오트)
    unknown:
      - 관람객이 조립에 실제로 손을 대는 범위와 참가 방법
      - 조립하는 2족 보행 로봇의 제조사와 모델
      - 개막 첫날 관람객 수와 현장 반응
      - 탄생제는 12~13일 일정이라 개막일인 11일에는 열리지 않음

  - title: Dynamic Creatures × Hasbro Sixth Wall Studio, 캐릭터 로봇 협업 발표
    category: 엔터테크
    source:
      name: Robotics 24/7
      url: https://www.robotics247.com/article/dynamic-creatures-hasbros-sixth-wall-studio-partner-to-develop-robotic-creatures-that-engage-visitors-at-theme-parks-and-resorts
      published: 2026-11-11
    happened: 미확인
    what: 캐릭터 로봇 회사 Dynamic Creatures와 해즈브로의 AI 스튜디오 Sixth Wall이, 해즈브로 캐릭터를 테마파크와 리조트에서 손님과 대화하는 로봇으로 만들기로 했다.
    insight: 사람들은 여러 세대에 걸쳐 가상의 캐릭터와 깊은 유대를 맺어 왔다.
    insight_basis: 기사에 명시
    idea: 캐릭터를 화면이나 인형 탈이 아니라, 손님을 기억하고 다음에 만났을 때 안부를 묻는 걸어 다니는 로봇으로 만든다.
    execution:
      - 리조트에서 캐릭터 로봇이 손님을 맞이한다
      - 로봇이 손님에게 모험(퀘스트)을 하나 맡긴다
      - 나중에 다시 마주치면 그 손님을 기억하고 모험이 어땠는지 묻는다
      - 대화와 함께 시선·몸짓·표정으로 반응한다
      - 기억 기능은 손님이 선택하고 허락한 범위 안에서만 쓴다
    tech:
      - SnowJay (Dynamic Creatures의 로봇 AI 플랫폼 — 인지·움직임·행동, 대화·기억·표정·애니매트로닉스를 묶음)
      - CharacterOS (Sixth Wall의 캐릭터 플랫폼)
      - Behavioral Licensing 프레임워크 (캐릭터의 말투와 행동을 원작 성격에 맞춤)
    unknown:
      - 어떤 해즈브로 캐릭터인지
      - 실제로 놓일 테마파크·리조트와 공개 시기 (발표 단계이며 운영 중인 체험은 없음)
      - 로봇의 기반 기체와 대수
      - 손님 정보를 어떻게 저장하고 지우는지
      - 협업을 발표한 정확한 날짜 (기사 게재일은 11월 11일)
