<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>dear.interaction 대시보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="lock" class="lock">
    <form class="lock-card" id="lock-form" autocomplete="off">
      <p class="brand">dear.interaction</p>
      <h1>작업 대시보드</h1>
      <p class="lock-sub">PIN 8자리를 넣어 주세요.</p>
      <label class="sr" for="pin">PIN</label>
      <input id="pin" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••••••" autofocus />
      <button type="submit" id="unlock">열기</button>
      <p id="lock-msg" class="lock-msg" role="status" aria-live="polite"></p>
    </form>
  </main>

  <div id="app" hidden>
    <header class="top">
      <div class="top-inner">
        <p class="brand">dear.interaction</p>
        <nav class="tabs" role="tablist" aria-label="화면">
          <button type="button" role="tab" data-tab="todo">내 할 일 <span id="tab-todo-n" class="tab-n"></span></button>
          <button type="button" role="tab" data-tab="cases">사례 <span id="tab-cases-n" class="tab-n"></span></button>
          <button type="button" role="tab" data-tab="schedule">업로드 일정</button>
          <button type="button" role="tab" data-tab="research">2026 리서치</button>
          <button type="button" role="tab" data-tab="status">진행 현황</button>
        </nav>
        <button class="lock-btn" id="lock-btn" type="button">잠그기</button>
      </div>
    </header>

    <div class="wrap">
      <section id="view-todo" class="view" role="tabpanel" aria-label="내 할 일"></section>
      <section id="view-cases" class="view" role="tabpanel" aria-label="사례" hidden></section>
      <section id="view-schedule" class="view" role="tabpanel" aria-label="업로드 일정" hidden></section>
      <section id="view-research" class="view" role="tabpanel" aria-label="2026 리서치" hidden></section>
      <section id="view-status" class="view" role="tabpanel" aria-label="진행 현황" hidden></section>
      <p class="foot" id="foot"></p>
    </div>

    <div id="scrim" class="scrim" hidden></div>
    <aside id="panel" class="panel" hidden role="dialog" aria-modal="true" aria-labelledby="p-title">
      <div class="panel-head">
        <button class="back" id="p-close" type="button">← 목록으로</button>
      </div>
      <div class="panel-body" id="p-body"></div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
